# 1. PODSTAWOWA KONFIGURACJA
# Zmień na https://jasiecki.com/ dopiero PO przepięciu domen u rejestratora
baseURL = "https://jasiecki.com/"
languageCode = "en-us"
title = "Łukasz Jasiecki - Dynamics 365"
theme = "PaperMod"

# 2. NAPRAWA ŚCIEŻEK (OBRAZKI I STYLE)
# Te opcje pomagają, gdy strona jest w podfolderze na GitHubie
#canonifyURLs = true
#relativeURLs = true

# 3. KONFIGURACJA TREŚCI
[taxonomies]
    category = "categories"
    tag = "tags"
    series = "series"

# 4. MENU NAWIGACYJNE
[[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

#[[menu.main]]
#    identifier = "categories"
#   name = "Kategorie"
#    url = "/categories/"
#    weight = 20

# 5. PAPERMOD THEME PARAMETERS
[params]
    env = "production"
    description = "Blog about Dynamics 365 and Azure technologies"
    author = "Łukasz Jasiecki"
    
    # Home page appearance
    [params.homeInfoParams]
        Title = "Welcome to my blog!"
        Content = "I write about Dynamics 365 implementations, Azure, and system integrations."

    # Ikony społecznościowe (opcjonalnie)
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/lukaszjasiecki32"

    # Ustawienia artykułów
    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    
    # Optymalizacja pod obrazki
    images = ["/images/2024/05/HC_Title.jpg"]

# 6. KONFIGURACJA SYNTATYKI KODU (Ważne dla Dynamics/Azure)
[markup]
  [markup.highlight]
    noClasses = false
    style = "monokai" # Styl kolorowania kodu

    # 7. GOOGLE ANALYTICS
[services]
  [services.googleAnalytics]
    ID = "G-8SGNN60P6B"